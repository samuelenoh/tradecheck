# Runs the tests on every push and pull request. Free for public repositories.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund   # installs jsdom so the page and end-to-end tests run too
      - run: npm test
